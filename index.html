<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alô Pedreiro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <section id="tela-inicio" class="tela ativa">
        <h1>Alô Pedreiro</h1>
        <p>O que você quer fazer?</p>
        <button onclick="mostrarTela('tela-orcamento')">Orçamento de materiais</button>
    </section>

    <section id="tela-orcamento" class="tela">
        <button class="voltar" onclick="mostrarTela('tela-inicio')">← Voltar</button>
        <h2>Orçamento de materiais</h2>
        <p>Escolha o que vai orçar:</p>
        <button onclick="mostrarTela('tela-ceramica')">Cerâmica</button>
        <button onclick="mostrarTela('tela-contrapiso')">Contrapiso</button>
        <button onclick="mostrarTela('tela-parede')">Parede (tijolo)</button>
    </section>

    <section id="tela-ceramica" class="tela">
        <button class="voltar" onclick="mostrarTela('tela-orcamento')">← Voltar</button>
        <h2>Cerâmica</h2>

        <label for="largura">Largura (m)</label>
        <input type="number" id="largura" step="0.01">

        <label for="comprimento">Comprimento (m)</label>
        <input type="number" id="comprimento" step="0.01">

        <label for="altura">Altura (m)</label>
        <input type="number" id="altura" step="0.01">

        <label for="caixa">Metragem da caixa de cerâmica (m²)</label>
        <input type="number" id="caixa" step="0.01">

        <label for="perda">Perda (%)</label>
        <input type="number" id="perda" value="10">

        <button onclick="mostrarCerâmica()">Calcular cerâmica</button>

        <div id="resultado"></div>
    </section>

    <section id="tela-contrapiso" class="tela">
        <button class="voltar" onclick="mostrarTela('tela-orcamento')">← Voltar</button>
        <h2>Contrapiso</h2>

        <label>Comprimento (m)</label>
        <input type="number" id="cp-comprimento" step="0.01">

        <label>Largura (m)</label>
        <input type="number" id="cp-largura" step="0.01">

        <label>Espessura (cm)</label>
        <input type="number" id="cp-espessura" value="5">

        <button onclick="mostrarContrapiso()">Calcular contrapiso</button>

        <div id="resultado-contrapiso"></div>
    </section>

    <section id="tela-parede" class="tela">
        <button class="voltar" onclick="mostrarTela('tela-orcamento')">← Voltar</button>
        <h2>Parede (tijolo)</h2>

        <label>Comprimento da parede (m)</label>
        <input type="number" id="pa-comprimento" step="0.01">

        <label>Altura da parede (m)</label>
        <input type="number" id="pa-altura" step="0.01">

        <label>Portas e janelas (m²), se tiver</label>
        <input type="number" id="pa-vaos" value="0" step="0.01">

        <label>Tijolos por m²</label>
        <input type="number" id="pa-tijolos-m2" value="30">

        <button onclick="mostrarParede()">Calcular parede</button>

        <div id="resultado-parede"></div>
    </section>

    <script src="app.js"></script>
</body>
</html>
